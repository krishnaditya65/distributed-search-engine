// engine.proto — the wire contract between the Go coordinator layer and the
// C++ engine (data node) layer. This is the ONLY thing the two languages
// agree on; everything else is private to each side.
//
// Design notes:
//  - A "shard" is the unit of storage on an engine node: one inverted index +
//    one vector (HNSW) index + one WAL + one on-disk segment set.
//  - Documents are passed as raw JSON strings ("json") rather than a typed
//    protobuf message, because the document schema is user-defined
//    (schemaless, like Elasticsearch). The engine parses/analyzes fields
//    according to the shard's field mapping (set at CreateShard time).
//  - Filters, aggregations and vector queries are explicit typed messages
//    (not a generic query DSL blob) to keep the C++ query planner simple and
//    to make the scatter-gather contract explicit and versioned.

syntax = "proto3";

package dse;

option go_package = "dse/coordinator/internal/genproto;genproto";

// ---------------------------------------------------------------------------
// Documents
// ---------------------------------------------------------------------------

message Document {
  string id = 1;      // document id (assigned by coordinator if not supplied)
  string json = 2;     // raw JSON body
  int64 version = 3;   // monotonically increasing version, set by the engine
}

message IndexRequest {
  string shard_id = 1;
  Document document = 2;
}

message IndexResponse {
  bool success = 1;
  string error = 2;
  int64 version = 3;
}

message GetRequest {
  string shard_id = 1;
  string doc_id = 2;
}

message GetResponse {
  bool found = 1;
  Document document = 2;
}

message DeleteRequest {
  string shard_id = 1;
  string doc_id = 2;
}

message DeleteResponse {
  bool success = 1;
  bool found = 2;
}

message BulkOp {
  enum Type {
    INDEX = 0;
    DELETE = 1;
  }
  Type type = 1;
  string doc_id = 2;       // required for DELETE, optional for INDEX
  string json = 3;         // required for INDEX
}

message BulkRequest {
  string shard_id = 1;
  repeated BulkOp ops = 2;
}

message BulkResult {
  bool success = 1;
  string error = 2;
  string doc_id = 3;
}

message BulkResponse {
  repeated BulkResult results = 1;
}

// ---------------------------------------------------------------------------
// Search
// ---------------------------------------------------------------------------

message TermFilter {
  string field = 1;
  string value = 2;
}

message RangeFilter {
  string field = 1;
  optional double gte = 2;
  optional double lte = 3;
}

message Filter {
  repeated TermFilter term = 1;
  repeated RangeFilter range = 2;
}

message VectorQuery {
  string field = 1;
  repeated float embedding = 2;
  int32 k = 3;              // top-k nearest neighbors to consider locally
}

// A single bucket-producing aggregation request.
message Aggregation {
  string name = 1;           // caller-chosen result key
  string type = 2;           // "terms" | "stats" | "histogram"
  string field = 3;
  int32 size = 4;             // for "terms": max buckets to return
  double interval = 5;        // for "histogram": bucket width
}

message SearchRequest {
  string shard_id = 1;
  string query_text = 2;               // free-text query, "" = match_all
  repeated string fields = 3;          // fields to run BM25 over
  Filter filter = 4;
  VectorQuery vector = 5;              // optional; field == "" means no vector search
  double vector_weight = 6;            // 0..1 blend weight for hybrid scoring
  repeated Aggregation aggregations = 7;
  int32 size = 8;                      // hits to return from this shard
  int32 from = 9;                      // offset within this shard
}

message SearchHit {
  string doc_id = 1;
  double score = 2;
  string json = 3;
}

message Bucket {
  string key = 1;
  int64 doc_count = 2;
}

message StatsResult {
  int64 count = 1;
  double sum = 2;
  double min = 3;
  double max = 4;
  double avg = 5;
}

message AggregationResult {
  string name = 1;
  repeated Bucket buckets = 2;    // populated for "terms"/"histogram"
  StatsResult stats = 3;         // populated for "stats"
}

message SearchResponse {
  bool success = 1;
  string error = 2;
  repeated SearchHit hits = 3;
  int64 total_hits = 4;                       // total matches on this shard (pre-truncation)
  repeated AggregationResult aggregations = 5;
  int64 took_micros = 6;
}

// ---------------------------------------------------------------------------
// Shard administration
// ---------------------------------------------------------------------------

message FieldMapping {
  string field = 1;
  string type = 2;   // "text" | "keyword" | "number" | "vector"
  int32 vector_dim = 3;
}

message CreateShardRequest {
  string shard_id = 1;
  repeated FieldMapping mappings = 2;
}

message CreateShardResponse {
  bool success = 1;
  string error = 2;
}

message FlushRequest {
  string shard_id = 1;
}

message FlushResponse {
  bool success = 1;
  string error = 2;
  int32 segment_id = 3;
}

message MergeRequest {
  string shard_id = 1;
}

message MergeResponse {
  bool success = 1;
  string error = 2;
  int32 segments_merged = 3;
  int32 result_segment_id = 4;
}

message ShardStatusRequest {
  string shard_id = 1;
}

message ShardStatusResponse {
  bool exists = 1;
  int64 doc_count = 2;
  int64 deleted_count = 3;
  int32 segment_count = 4;
  int64 wal_size_bytes = 5;
  int64 memtable_doc_count = 6;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  string node_id = 2;
  repeated string shard_ids = 3;
  int64 uptime_seconds = 4;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service EngineService {
  // Document CRUD
  rpc IndexDocument(IndexRequest) returns (IndexResponse);
  rpc GetDocument(GetRequest) returns (GetResponse);
  rpc DeleteDocument(DeleteRequest) returns (DeleteResponse);
  rpc BulkIndex(BulkRequest) returns (BulkResponse);

  // Search (this is the target of scatter-gather fan-out)
  rpc Search(SearchRequest) returns (SearchResponse);

  // Shard / segment administration
  rpc CreateShard(CreateShardRequest) returns (CreateShardResponse);
  rpc Flush(FlushRequest) returns (FlushResponse);
  rpc Merge(MergeRequest) returns (MergeResponse);
  rpc ShardStatus(ShardStatusRequest) returns (ShardStatusResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
}
